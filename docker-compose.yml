services:
  db:
    image: postgres:15
    container_name: backend_movie_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  s3:
    image: minio/minio
    container_name: backend_movie_s3
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    command: server /data --console-address ":9001"
    volumes:
      - s3data:/data
      
# O Worker das Filas (Jobs)
  worker:
    build: .
    command: php artisan queue:work --queue=high,default,translation,images
    volumes:
      - .:/app
    depends_on:
      - db

  # O Scheduler (Cron das 3h da manhã)
  scheduler:
    build: .
    command: php artisan schedule:work
    volumes:
      - .:/app
    depends_on:
      - db

volumes:
  pgdata:
  s3data: